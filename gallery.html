  <main class="container">
    <section>
      <h2>Photo Gallery</h2>
      <p>Moments from my study and projects — hover or tap to see captions.</p>

      <div class="gallery-grid" aria-live="polite">
        <figure class="gallery-item">
          <img src="Images/dog.jpg" alt="Coding session late night" loading="lazy" />
          <figcaption>Coding session — debugging until dawn</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="Images/dog.jpg" alt="Collaborating with teammates" loading="lazy" />
          <figcaption>Team project presentation — collaboration matters</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="Images/dog.jpg" alt="Working with laptop and coffee" loading="lazy" />
          <figcaption>Late night coding with coffee</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="Images/dog.jpg" alt="Project screenshot" loading="lazy" />
          <figcaption>Web app UI from a class project</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="Images/dog.jpg" alt="Hackathon team" loading="lazy" />
          <figcaption>Hackathon — building an MVP in 24 hours</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="Images/dog.jpg" alt="Certificate and awards" loading="lazy" />
          <figcaption>Small recognitions for coding challenges</figcaption>
        </figure>
      </div>

      <p class="muted">Tip: replace the placeholder images in the <code>Images/</code> folder with your real photos to personalize the gallery.</p>
    </section>
  </main>

  <footer class="site-footer">
